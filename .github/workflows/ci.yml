name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit subjects
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every new commit follows the convention the release reads
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_RANGE: ${{ github.event.before }}..${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          range=${PUSH_RANGE}
          if [[ ${EVENT} == pull_request ]]; then range=${PR_BASE}..${PR_HEAD}; fi
          if [[ ${range} == 0000000000000000000000000000000000000000..* ]]; then exit 0; fi
          bash scripts/check-commits.sh --range "${range}"

  lint:
    name: Lint and format
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: lint

      - name: Install
        run: uv sync --all-extras --dev

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Types
        run: uv run pyright

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the page test tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test the page, every line of its script
        run: pnpm test:coverage

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh

      - name: Lint the YAML
        run: uv run yamllint --strict .

      - name: Format the JSON and YAML
        run: pnpm run format:check

  browser:
    name: The page in a browser
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: browser

      - name: Install
        run: uv sync --all-extras --dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the page test tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the page against the simulated drive
        run: pnpm e2e

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-26.04-arm
            python: "3.14"
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        if: runner.os == 'Linux'
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: python-${{ matrix.python }}

      - name: Install
        run: uv sync --all-extras --dev --python ${{ matrix.python }}

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

  determinism:
    name: Determinism under a different environment
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: determinism

      - name: Install
        run: uv sync --all-extras --dev

      - name: Run the suite under a different locale, timezone and hash seed
        env:
          TZ: Pacific/Kiritimati
          LANG: pt_BR.UTF-8
          PYTHONHASHSEED: "12345"
        run: uv run pytest -q

  distribution:
    name: What a clone actually carries
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-suffix: distribution

      - name: Build the wheel and the source distribution
        run: uv build

      - name: The wheel carries every module and no test
        run: |
          python - <<'CHECK'
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          held = zipfile.ZipFile(wheel).namelist()
          modules = {name for name in held if name.endswith(".py")}
          missing = [
              str(path)
              for path in Path("src").rglob("*.py")
              if str(path.relative_to("src")) not in modules
          ]
          tests = [name for name in held if "test" in name.lower()]
          print(f"{len(modules)} modules in {wheel.name}")
          if missing:
              print(f"::error title=Missing from the wheel::{', '.join(missing)}")
          if tests:
              print(f"::error title=Test files in the wheel::{', '.join(tests)}")
          sys.exit(1 if missing or tests else 0)
          CHECK

      - name: A tarball built out of git runs
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=fdstoolkit/ -o /tmp/source.tar.gz HEAD
          mkdir -p /tmp/from-git
          tar -xzf /tmp/source.tar.gz -C /tmp/from-git
          uv venv --quiet /tmp/from-git/.venv
          uv pip install --quiet --python /tmp/from-git/.venv /tmp/from-git/fdstoolkit
          /tmp/from-git/.venv/bin/fdstoolkit --version
          /tmp/from-git/.venv/bin/fdstoolkit doctor
          /tmp/from-git/.venv/bin/fdstoolkit blank -o /tmp/blank.fds --sides 1 --formatted
          /tmp/from-git/.venv/bin/fdstoolkit verify /tmp/blank.fds
