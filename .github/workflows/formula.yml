name: Formula

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The release tag to point the formula at
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Point the formula at the new release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite the formula for ${{ inputs.tag || github.event.release.tag_name }}
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: bash scripts/update-formula.sh "${TAG}"

      - name: Commit when the formula changed
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -eu
          if git diff --quiet Formula/fdstoolkit.rb; then
            echo "the formula already points at this release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fdstoolkit.rb
          git commit -m "chore(formula): point at ${TAG} [skip ci]"
          git push origin main
