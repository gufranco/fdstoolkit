name: Formula

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The release tag to point the formula at
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: ask the tap to bump the formula
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: app-token
        with:
          client-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: gufranco
          repositories: homebrew-tap

      - name: Dispatch the tap's formula-bump workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          asset="fdstoolkit-${TAG#v}.tar.gz"
          jq -nc --arg tag "${TAG}" --arg asset "${asset}" \
            '{event_type: "formula-bump",
              client_payload: {name: "fdstoolkit", tag: $tag, asset: $asset}}' \
            | gh api --method POST repos/gufranco/homebrew-tap/dispatches --input -
