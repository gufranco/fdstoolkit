name: Formula

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The release tag to point the formula at
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: ask the tap to bump the formula
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: gufranco
          repositories: homebrew-tap

      - name: Dispatch the tap's formula-bump workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          jq -nc --arg tag "${TAG}" \
            '{event_type: "formula-bump", client_payload: {name: "fdstoolkit", tag: $tag}}' \
            | gh api --method POST repos/gufranco/homebrew-tap/dispatches --input -
