name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record the tag that already existed
        id: before
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
        shell: bash

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Describe what ships
        run: |
          uv venv --quiet .sbom
          uv pip install --quiet --python .sbom .
          uvx --from cyclonedx-bom==6.0.0 cyclonedx-py environment .sbom \
            --output-format json --outfile sbom.json
        shell: bash

      - name: Nothing ships that was not declared
        run: |
          python - <<'CHECK'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          def normal(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          locked = tomllib.loads(Path("uv.lock").read_text())
          declared = {normal(package["name"]) for package in locked["package"]}
          seeded = {"pip", "setuptools"}
          held = json.loads(Path("sbom.json").read_text())
          components = held.get("components", ())
          named = sorted(normal(one["name"]) for one in components)
          extra = [one for one in named if one not in declared | seeded]
          print(f"components: {', '.join(named) or 'none'}")
          if extra:
              print(f"::error title=Not in uv.lock::{', '.join(extra)}")
              sys.exit(1)
          CHECK
        shell: bash

      - name: Drop the build path from the bill of materials
        run: |
          python - <<'STRIP'
          import json
          from pathlib import Path

          held = Path("sbom.json")
          bom = json.loads(held.read_text())
          for component in bom.get("components", ()):
              kept = [
                  ref
                  for ref in component.get("externalReferences", ())
                  if not str(ref.get("url", "")).startswith("file://")
              ]
              if kept:
                  component["externalReferences"] = kept
              else:
                  component.pop("externalReferences", None)
          held.write_text(json.dumps(bom, indent=2, sort_keys=True) + "\n")
          leaked = [one for one in json.dumps(bom).split('"') if one.startswith("file://")]
          if leaked:
              print(f"::error title=Build path retained::{leaked}")
          raise SystemExit(1 if leaked else 0)
          STRIP
        shell: bash

      - name: Sign it
        run: uvx sigstore==4.5.0 sign sbom.json --bundle sbom.json.sigstore.json
        shell: bash

      - name: Resolve the released tag
        id: released
        env:
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "${tag}" ]; then
            echo "tag=" >>"$GITHUB_OUTPUT"
            reason="No version tag is reachable, so there is nothing to attach."
            echo "::notice title=No release::${reason}"
          elif [ "${tag}" = "${BEFORE}" ]; then
            echo "tag=" >>"$GITHUB_OUTPUT"
            reason="${tag} was already published, so its assets stay as they are."
            echo "::notice title=No release::${reason}"
          else
            echo "tag=${tag}" >>"$GITHUB_OUTPUT"
            echo "released tag: ${tag}"
          fi
        shell: bash

      - name: Attach both to the release
        if: steps.released.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.released.outputs.tag }}
        run: gh release upload "${TAG}" sbom.json sbom.json.sigstore.json
        shell: bash

      - name: Move the latest tag onto this release
        if: steps.released.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.released.outputs.tag }}
        run: |
          sha=$(git rev-list -n 1 "${TAG}")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f sha="${sha}" -F force=true >/dev/null 2>&1 ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" -f sha="${sha}" >/dev/null
          echo "latest -> ${TAG} (${sha})"
        shell: bash

  formula:
    name: Point the formula at the new release
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/formula.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
    secrets: inherit
