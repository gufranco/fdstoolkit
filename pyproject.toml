[project]
name = "fdstoolkit"
dynamic = ["version"]
description = "A command-line toolkit for Famicom Disk System media: reading it, judging it, reconstructing it, writing it back, and keeping the drive that does all of that in adjustment."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Franco" }]
keywords = ["famicom", "fds", "disk-system", "preservation", "emulation", "qd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
    "typer>=0.19.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
hardware = ["hidapi>=0.14.0"]
ui = ["fastapi>=0.115.0", "uvicorn>=0.32.0", "pydantic>=2.9.0"]

[project.urls]
Homepage = "https://github.com/gufranco/fdstoolkit"
Issues = "https://github.com/gufranco/fdstoolkit/issues"

[project.scripts]
fdstoolkit = "fdstoolkit.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "hypothesis>=6.140.0",
  "ruff>=0.14.0",
  "pyright>=1.1.406",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "httpx2>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fdstoolkit/version.py"
pattern = "^VERSION = \"(?P<version>[^\"]+)\"$"

[tool.hatch.build.targets.wheel]
packages = ["src/fdstoolkit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
  "CPY001",
  "TC001",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR2004", "SLF001", "INP001", "ANN401"]
"src/fdstoolkit/cli/*.py" = ["PLR0913", "FBT001", "FBT002"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests/support"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
norecursedirs = [".*", "node_modules", "dist"]
addopts = "-q --strict-markers --strict-config --cov --cov-report=term-missing"
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
  "corpus: runs against the local image corpus named by FDSTOOLKIT_CORPUS",
  "hardware: needs a real device attached",
]

[tool.coverage.run]
branch = true
source = ["src/fdstoolkit"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
