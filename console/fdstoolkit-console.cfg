MEMORY {
    ZP:      start = $0010, size = $00E0, type = rw;
    WORK:    start = $0400, size = $0400, type = rw;
    MAIN:    start = $6000, size = $7FF6, type = ro, file = "%O-main.bin";
    VECTORS: start = $DFF6, size = $000A, type = ro, file = "%O-vectors.bin";
    BOOT:    start = $2000, size = $0001, type = ro, file = "%O-boot.bin";
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    BSS:      load = WORK,    type = bss;
    TIMED:    load = MAIN,    type = ro, align = $100;
    CODE:     load = MAIN,    type = ro;
    RODATA:   load = MAIN,    type = ro;
    VECTORS:  load = VECTORS, type = ro;
    BOOT:     load = BOOT,    type = ro;
}
