[project]
name = "fdstk"
version = "0.1.0"
description = "Famicom Disk System preservation toolkit: convert, verify, identify, create, dump and write disk images"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Franco" }]
keywords = ["famicom", "fds", "disk-system", "preservation", "emulation", "qd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = ["typer>=0.19.0", "rich>=14.0.0"]

[project.urls]
Homepage = "https://github.com/gufranco/fdstk"
Issues = "https://github.com/gufranco/fdstk/issues"

[project.scripts]
fds = "fdstk.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "hypothesis>=6.140.0",
  "ruff>=0.14.0",
  "pyright>=1.1.406",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdstk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "COM812",
  "ISC001",
  "CPY001",
  "TC001",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001", "INP001"]
"src/fdstk/cli/*.py" = ["PLR0913", "FBT001", "FBT002"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "corpus: runs against the local image corpus named by FDSTK_CORPUS",
  "hardware: needs a real device attached",
]

[tool.coverage.run]
branch = true
source = ["src/fdstk"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
