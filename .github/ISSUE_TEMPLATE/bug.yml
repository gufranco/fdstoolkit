name: Something does not work
description: A command failed, produced the wrong output, or wrote the wrong bytes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach a disk image or a BIOS. If a specific file is
        involved, `fdstoolkit hash` prints the digests that identify it without
        sending it anywhere.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it printed. Paste the output rather than describing it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `fdstoolkit doctor`, or the release tag you installed.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: macOS 15, Python 3.13
    validations:
      required: true
