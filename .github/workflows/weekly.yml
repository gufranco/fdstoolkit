name: Weekly

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install the package and the newest tools
        run: |
          uv pip install --system --upgrade \
            '.[hardware,ui]' ruff pyright pytest pytest-cov hypothesis httpx2

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: pyright

      - name: The suite, against nothing but the repository
        run: python -m pytest -q -p no:randomly
