name: Weekly

on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the USB headers hidapi builds against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libusb-1.0-0-dev libudev-dev

      - name: Install the package and the newest tools
        run: |
          uv pip install --system --upgrade \
            '.[hardware,ui]' ruff pyright pytest pytest-cov hypothesis httpx2 faker

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: pyright

      - name: The suite, against nothing but the repository
        run: python -m pytest -q -p no:randomly
