name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record the tag that already existed
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)" >>"$GITHUB_OUTPUT"
        shell: bash

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Describe what ships
        run: |
          python -m venv .sbom
          .sbom/bin/pip install --quiet --disable-pip-version-check .
          python -m pip install --disable-pip-version-check cyclonedx-bom==6.0.0
          python -m cyclonedx_py environment .sbom \
            --output-format json --outfile sbom.json
        shell: bash

      - name: Nothing ships that was not declared
        run: |
          python - <<'CHECK'
          import json
          import sys
          import tomllib
          from pathlib import Path

          locked = tomllib.loads(Path("uv.lock").read_text())
          declared = {package["name"].lower() for package in locked["package"]}
          seeded = {"pip", "setuptools"}
          held = json.loads(Path("sbom.json").read_text())
          named = sorted(one["name"].lower() for one in held.get("components", ()))
          extra = [one for one in named if one not in declared | seeded]
          print(f"components: {', '.join(named) or 'none'}")
          if extra:
              print(f"::error title=Not in uv.lock::{', '.join(extra)}")
              sys.exit(1)
          CHECK
        shell: bash

      - name: Drop the build path from the bill of materials
        run: |
          python - <<'STRIP'
          import json
          from pathlib import Path

          held = Path("sbom.json")
          bom = json.loads(held.read_text())
          for component in bom.get("components", ()):
              kept = [
                  ref
                  for ref in component.get("externalReferences", ())
                  if not str(ref.get("url", "")).startswith("file://")
              ]
              if kept:
                  component["externalReferences"] = kept
              else:
                  component.pop("externalReferences", None)
          held.write_text(json.dumps(bom, indent=2, sort_keys=True) + "\n")
          leaked = [one for one in json.dumps(bom).split('"') if one.startswith("file://")]
          if leaked:
              print(f"::error title=Build path retained::{leaked}")
          raise SystemExit(1 if leaked else 0)
          STRIP
        shell: bash

      - name: Sign it
        run: |
          python -m pip install --disable-pip-version-check sigstore==4.5.0
          python -m sigstore sign sbom.json --bundle sbom.json.sigstore.json
        shell: bash

      - name: Resolve the released tag
        id: released
        env:
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "${tag}" ]; then
            echo "tag=" >>"$GITHUB_OUTPUT"
            echo "::notice title=No release::No version tag is reachable, so there is nothing to attach."
          elif [ "${tag}" = "${BEFORE}" ]; then
            echo "tag=" >>"$GITHUB_OUTPUT"
            echo "::notice title=No release::${tag} was already published, so its assets stay as they are."
          else
            echo "tag=${tag}" >>"$GITHUB_OUTPUT"
            echo "released tag: ${tag}"
          fi
        shell: bash

      - name: Attach both to the release
        if: steps.released.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.released.outputs.tag }}
        run: gh release upload "${TAG}" sbom.json sbom.json.sigstore.json
        shell: bash

      - name: Point the formula at the tag that was just published
        if: steps.released.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMULA_BOT_NAME: github-actions[bot]
          FORMULA_BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/publish-formula.sh
        shell: bash

      - name: Move the latest tag onto this release
        if: steps.released.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.released.outputs.tag }}
        run: |
          sha=$(git rev-list -n 1 "${TAG}")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f sha="${sha}" -F force=true >/dev/null 2>&1 ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/latest" -f sha="${sha}" >/dev/null
          echo "latest -> ${TAG} (${sha})"
        shell: bash
